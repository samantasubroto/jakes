<ng-container *ngIf="product$ | async as product">
  <!-- LIKE BUTTON -->
  <div class="fav" (click)="toggleLike(product)" [class.liked]="product?.liked">
    <cx-icon [type]="product?.liked ? iconTypes.LIKE : iconTypes.UNLIKE"></cx-icon>
  </div>

  <!-- PRODUCT SUMMARY -->
  <div class="product-summary">
    <div class="code">
      {{ 'productSummary.id' | cxTranslate }} {{ product?.code }}
    </div>
  </div>
</ng-container>
